<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Open RPM is a free, open-source, client-side implementation of Raven's Progressive Matrices (IQ test). English, Russian and Indonesian.">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>Open RPM — Raven's Progressive Matrices Test</title>
    <link rel="preload" href="fonts/ubuntu-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script>
        // Preload the right font subset and the first matrix before the CSS/JS
        // has even been parsed. Skipped when the user asks to save data.
        (function () {
            try {
                var conn = navigator.connection || {};
                var reduced = window.matchMedia &&
                    window.matchMedia('(prefers-reduced-data: reduce)').matches;
                var lang = localStorage.getItem('raven_lang') ||
                    (navigator.language || 'en').slice(0, 2);

                if (lang === 'ru') {
                    var font = document.createElement('link');
                    font.rel = 'preload';
                    font.as = 'font';
                    font.type = 'font/woff2';
                    font.href = 'fonts/ubuntu-cyrillic.woff2';
                    font.crossOrigin = 'anonymous';
                    document.head.appendChild(font);
                }

                if (!conn.saveData && !reduced) {
                    var image = document.createElement('link');
                    image.rel = 'preload';
                    image.as = 'image';
                    image.href = 'images/1.svg';
                    image.setAttribute('fetchpriority', 'high');
                    document.head.appendChild(image);
                }
            } catch (e) { /* storage may be disabled */ }
        })();
    </script>

<style>
:root {
    --bg-color: #000000;
    --window-bg: #121212;

    --primary-text: #ffffff;
    --secondary-text: #dddddd;
    --body-text: #b0b3b8;
    --muted-text: #666666;

    --accent-color: #333333;
    --accent-hover: #4d4d4d;
    --border-color: #2a2a2a;
    --input-bg: #1a1a1a;

    --danger-color: #e74c3c;
    --focus-outline: #2a2a2a;

    --app-width: clamp(15rem, 60vw, 45rem);

    --fluid-font-size: clamp(0.75rem, 1.1vw, 1rem);
}

/* Subset fonts: the browser only downloads the alphabet the page needs.
   Generated by tools/build.py (full source: fonts/ubuntu.ttf). */
@font-face {
    font-family: 'Ubuntu';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('fonts/ubuntu-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+2000-206F, U+20AC;
}

@font-face {
    font-family: 'Ubuntu';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('fonts/ubuntu-cyrillic.woff2') format('woff2');
    unicode-range: U+0400-045F;
}

*, *::before, *::after {
    box-sizing: border-box;
}

body {
    font-family: 'Ubuntu';
    background-color: var(--bg-color);
    color: var(--body-text);
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
    font-size: var(--fluid-font-size);
}

.container {
    width: 90%;
    max-width: 80rem;

    margin: 0 auto;
    padding: 0.8rem;
    text-align: center;
    flex:1;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

h1, h2 {
    color: var(--primary-text);
    margin-top: 0;
    font-weight: 300;
    letter-spacing: 0.06rem;
    word-wrap: break-word;
}

h1 {
    font-size: 1.8rem;
    margin-bottom: 0.2rem;
}
h2 { font-size: 1.4rem; }

h3 {
    color: var(--secondary-text);
    font-weight: 400;
    font-size: 0.9rem;
    margin-top: 0;
    margin-bottom: 1rem;
}

.hidden { display: none !important; }

.btn {
    background-color: var(--accent-color);
    color: white;
    border: 0.06rem solid var(--border-color);
    padding: 0.6rem 1.5rem;
    font-size: 0.9rem;
    font-weight: 400;
    cursor: pointer;
    border-radius: 0.25rem;
    transition: none;
    margin: 0.4rem;
    letter-spacing: 0.03rem;
    display: inline-block;
    text-decoration: none;
}

.btn:hover {
    background-color: var(--accent-hover);
    border-color: #555;
    color: #fff;
}

.btn:active {
    background-color: #222;
    transform: translateY(0.06rem);
}

.btn:focus-visible {
    outline: 0.1rem solid var(--focus-outline);
    outline-offset: 0.1rem;
}

.btn:disabled {
    background-color: #080808;
    color: #333;
    cursor: not-allowed;
    border-color: #080808;
}

.btn-confirm {
    background-color: #333;
    border-color: #444;
}
.btn-confirm:hover { background-color: #444; }

.btn-cancel {
    background-color: #111;
    color: #888;
    border-color: #222;
}
.btn-cancel:hover { color: #ccc; background-color: #222; }

.btn-finish {
    background-color: #444;
    border-color: #555;
}

.instruction-box {
    background: var(--window-bg);
    padding: 1.8rem;
    border-radius: 0.25rem;
    border: 0.06rem solid var(--border-color);

    width: 100%;
    max-width: 36rem;
    margin: 0 auto 1rem auto;

    text-align: left;
    max-height: 60vh;
    overflow-y: auto;
    line-height: 1.5;
    color: var(--body-text);
}

.instruction-box::-webkit-scrollbar { width: 0.5rem; }
.instruction-box::-webkit-scrollbar-track { background: #000; }
.instruction-box::-webkit-scrollbar-thumb { background: #333; border-radius: 0.25rem; }
.instruction-box::-webkit-scrollbar-thumb:hover { background: #444; }

.form-group { margin-bottom: 1rem; text-align: left; }
label { display: block; margin-bottom: 0.4rem; font-weight: 600; color: var(--secondary-text); font-size: 0.85em; }

select, input {
    width: 100%; padding: 0.6rem;
    background-color: var(--input-bg);
    border: 0.06rem solid var(--border-color);
    color: #ccc; border-radius: 0.25rem;
    box-sizing: border-box; font-size: 0.9rem;
    transition: none;
}
select:focus, input:focus {
    outline: 0.1rem solid var(--focus-outline);
    border-color: #555;
    background-color: #222;
}

#test-screen { padding-top: 1rem; }

.test-wrapper {
    display: grid;
    grid-template-columns:1fr;
    width: fit-content;
    max-width: var(--app-width);
    margin: 0 auto;
}

.timer-bar {
    background: #080808; height: 0.2rem;
    border-radius: 0;
    margin-bottom: 0.5rem;
    overflow: hidden;    position: relative;
    border: 0.06rem solid #1a1a1a;
    width: 100%;
}
.timer-progress { background: #ffffff; height: 100%; width: 100%; transition: width 1s linear; }
.timer-text {
    position: absolute; width: 100%; text-align: center; top: -1.2rem;
    line-height: 1rem; font-weight: 300; color: var(--secondary-text);
    font-size: 0.9rem; z-index: 2; letter-spacing: 0.1rem;
}

.progress-info { margin-bottom: 0.5rem; margin-top: 0.2rem; font-weight: 600; color: var(--muted-text); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.1rem; }

.question-area {
    background: var(--window-bg);
    padding: 0.6rem;
    border-radius: 0.25rem;
    border: 0.06rem solid var(--border-color);

    margin-bottom: 0.8rem;
    width: 100%;

    display: flex; justify-content: center; align-items: center;
}

.question-image {
    width: 100%;
    height: auto;
    max-height: 50vh;
    max-width: 100%;
    object-fit: contain;
    transition: opacity 0.12s ease-out;
    /* Reserve space before the SVG arrives so the page does not jump. */
    aspect-ratio: 996 / 922;

    border: 0.06rem solid var(--border-color);
    background: #000;
    box-shadow: 0 0.2rem 0.3rem rgba(0,0,0,0.3);
}

.question-image.is-loading {
    opacity: 0.35;
}

.options-grid {
    display: grid;
    gap: 0.4rem;
    margin-bottom: 0.8rem;
    width: 100%;
    min-width: 14rem;
    padding: 0.4rem 0;
    grid-template-columns: repeat(4, 1fr);
}

.options-grid.cols-6 {
    grid-template-columns: repeat(3, 1fr);
}

.option-btn {
    background: var(--input-bg);
    border: 0.06rem solid var(--border-color);
    border-radius: 0.25rem;
    padding: 0.4rem;
    cursor: pointer;
    transition: none;
    display: flex; justify-content: center;
    align-items: center; font-weight: 300;
    height: clamp(2.5rem, 3vw + 1rem, 3.2rem);
    color: var(--secondary-text);
    font-size: 1.2rem;
    width: 100%;
}

.option-btn:hover {
    background: #222;
    border-color: #444;
    color: white;
}

.option-btn:active {
    transform: translateY(0.06rem);
}

.option-btn.selected {
    background-color: #2a2a2a;
    color: white;
    border-color: #555;
}

.nav-controls {
    display: flex; justify-content: center; gap: 0.4rem;
    margin-top: 0.4rem;
    width: 100%;
}

.results-wrapper {
    display: flex;
    gap: 0.8rem;
    width: 100%;
    max-width: 65rem;
    margin: 0 auto;
    align-items: stretch;
    margin-bottom: 1rem;
    flex-wrap: wrap;
}

.result-card.main-card {
    flex: 2;
    display: flex;
    flex-direction: column;
    min-width: 15rem;
    overflow-x: auto;
}

.right-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    min-width: 15rem;
}

.result-card, .sub-card {
    background: var(--window-bg);
    padding: 1.2rem;
    border-radius: 0.25rem;
    border: 0.06rem solid var(--border-color);
    text-align: left;
    color: var(--body-text);
}

.result-card h3, .sub-card h3 {

    border-bottom: 0.06rem solid #222;
    padding-bottom: 0.4rem;

    font-size: 0.9rem;

.sub-card {

.sub-card p {

.score-big::after {

}

.diagnosis-text {

}

.stats-container {

    justify-content: space-between;

    border-radius: 0.25rem;
    padding: 0.6rem 1rem;

}

.stat-group {

<body>

<div class="container">

    <div id="intro-screen">
        <h1 data-i18n="app_title">Raven's Test</h1>
        <h3 data-i18n="app_subtitle">Raven's Progressive Matrices (RPM)</h3>

        <div class="instruction-box">
            <p><strong data-i18n="instructions_title">Instruction:</strong> <span data-i18n="instructions_text">You will be offered 60 tasks (5 series). Find the logical pattern and select the missing piece.</span></p>
            <p><strong data-i18n="time_text">Time: 20 minutes.</strong></p>
            <hr>

            <div class="form-group">
                <label for="lang-select" data-i18n="lang_label">Language:</label>
                <select id="lang-select" onchange="app.changeLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="ru">Русский</option>
                    <option value="id">Bahasa Indonesia</option>
                </select>
            </div>

            <div class="form-group">
                <label for="user-age" data-i18n="age_label">Age:</label>
                <select id="user-age">
                    <option value="100" data-i18n="age_14_30">14 - 30 years</option>
                    <option value="97" data-i18n="age_31_35">31 - 35 years</option>
                    <option value="93" data-i18n="age_36_40">36 - 40 years</option>
                    <option value="88" data-i18n="age_41_45">41 - 45 years</option>
                    <option value="82" data-i18n="age_46_50">46 - 50 years</option>
                    <option value="76" data-i18n="age_51_55">51 - 55 years</option>
                    <option value="70" data-i18n="age_56_plus">56 - 60+ years</option>
                </select>
            </div>
        </div>
        <button class="btn" onclick="app.startTest()" data-i18n="start_btn">Start</button>
    </div>

    <div id="test-screen" class="hidden">
        <div class="test-wrapper">
            <div class="timer-bar">
                <div class="timer-progress" id="timer-bar-fill"></div>
            </div>

            <div class="progress-info" id="progress-container"></div>

            <div class="question-area">
                <img id="q-image" class="question-image" alt="Matrix Question" decoding="async">
            </div>

            <div class="options-grid" id="options-container"></div>

            <div class="nav-controls">
                <button class="btn" id="btn-prev" onclick="app.prevQuestion()" data-i18n="btn_prev">Back</button>
                <button class="btn btn-cancel" onclick="app.confirmEndTest()" data-i18n="btn_end">End</button>
                <button class="btn" id="btn-next" onclick="app.nextQuestion()" data-i18n="btn_next">Next</button>
            </div>
        </div>
    </div>

    <div id="result-screen" class="hidden">

        <div class="results-wrapper">
            <div class="result-card main-card">
                <h3 data-i18n="result_label"></h3>
                <span class="score-big" id="final-iq"></span>
                <div class="diagnosis-text" id="final-diagnosis">--</div>

                <div class="stats-container">
                    <div class="stat-group">
                        <span class="stat-label" data-i18n="total_score_label"></span>
                        <span class="stat-value" id="total-raw-score"></span>
                    </div>
                    <div class="stat-group">
                        <span class="stat-label" data-i18n="time_taken_label"></span>
                        <span class="stat-value" id="time-taken"></span>
                    </div>
                    <div class="stat-group">
                        <span class="stat-label" data-i18n="result_age_label"></span>
                        <span class="stat-value" id="user-age-val"></span>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th data-i18n="th_series"></th>
                            <th data-i18n="th_correct"></th>
                            <th data-i18n="th_deviation"></th>
                        </tr>
                    </thead>
                    <tbody id="series-table-body"></tbody>
                </table>

        constructor(points) {
            this.points = points;

            if (x <= this.points[0].x) return this.points[0].y;
            if (x >= this.points[this.points.length - 1].x) return this.points[this.points.length - 1].y;

            let i = 0;
            for (let j = 0; j < this.points.length - 1; j++) {
                if (this.points[j].x <= x && x <= this.points[j+1].x) {
                    i = j;
                    break;
                }

            const p0 = this.points[Math.max(0, i - 1)];
            const p1 = this.points[i];
            const p2 = this.points[Math.min(this.points.length - 1, i + 1)];
            const p3 = this.points[Math.min(this.points.length - 1, i + 2)];

    class ImagePreloader {
        constructor() {
            this.connection = navigator.connection || {};
            this.requested = new Set();
            this.scheduled = false;
        }

        url(index) {
            return `${CONFIG.imagePath}${index}${CONFIG.imageExt}`;

        get saveData() {
            if (this.connection.saveData === true) return true;
            return !!(window.matchMedia &&

        }

        /** 0 = do not prefetch, 3 = normal desktop connection. */
        get aheadCount() {
            if (this.saveData) return 0;
            const type = this.connection.effectiveType;
            if (type === 'slow-2g' || type === '2g') return 0;
            if (type === '3g') return 1;
            return CONFIG.prefetchAhead;

        prefetch(index, priority) {
            if (index < 1 || index > CONFIG.questionCount) return;
            if (this.saveData || this.requested.has(index)) return;

            this.requested.add(index);
            const img = new Image();
            img.decoding = 'async';
            if ('fetchPriority' in img) img.fetchPriority = priority || 'low';
            img.onerror = () => this.requested.delete(index);
            img.src = this.url(index);
        }

        /** Queue neighbours of the current question, one idle callback at a time. */
        schedule(current) {
            if (this.scheduled) return;
            this.scheduled = true;

            const run = () => {
                this.scheduled = false;
                for (let i = 1; i <= this.aheadCount; i++) this.prefetch(current + i);
                for (let i = 1; i <= CONFIG.prefetchBehind; i++) this.prefetch(current - i);

            if ('requestIdleCallback' in window) {

            } else {

            this.loadSavedAge();
            this.applyTranslations();
            this.updateMetaTitle();
            this.updateWikiLink();

            this.registerServiceWorker();
        }

        registerServiceWorker() {
            if (!('serviceWorker' in navigator)) return;
            const local = ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) !== -1;
            if (location.protocol !== 'https:' && !local) return;

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
                    .catch(() => { /* offline support is optional */ });
            }, { once: true });
        }

        loadSavedAge() {
            const savedAge = localStorage.getItem('raven_age');
            if (savedAge && this.dom.userAge) this.dom.userAge.value = savedAge;
        }

        determineLanguage() {
            let lang = localStorage.getItem('raven_lang');
            if (!lang) lang = (navigator.language || navigator.userLanguage || 'en').substring(0, 2);
            if (TRANSLATIONS[lang]) this.currentLang = lang;
            else this.currentLang = 'en';
            document.documentElement.lang = this.currentLang;
            if (this.dom.langSelect) this.dom.langSelect.value = this.currentLang;
        }

        t(key) {
            return TRANSLATIONS[this.currentLang][key] || key;
        }

        updateMetaTitle() { document.title = this.t('site_title'); }

        updateWikiLink() {
            const linkEl = document.querySelector('[data-i18n-href="wiki_url"]');
            if (linkEl) {
                const url = this.t('wiki_url');
                if (url && typeof url === 'string') linkEl.href = url;
            }
        }

        changeLanguage(lang) {
            localStorage.setItem('raven_lang', lang);
            this.currentLang = lang;
            document.documentElement.lang = lang;
            this.applyTranslations();
            this.updateMetaTitle();
            this.updateWikiLink();
            if (this.testActive) this.renderQuestion();
            if (!this.screens.result.classList.contains('hidden')) this.calculateResults();
        }

        applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = this.t(el.getAttribute('data-i18n')));
            document.querySelectorAll('[data-i18n-href]').forEach(el => {
                const link = this.t(el.getAttribute('data-i18n-href'));
                if (link && typeof link === 'string') el.href = link;
            });
        }

        resetApp() {
            clearInterval(this.timerInterval);
            this.testActive = false;
            if(this.dom.confirmModal) this.dom.confirmModal.classList.add('hidden');
            this.screens.test.classList.add('hidden');
            this.screens.result.classList.add('hidden');
            this.currentQuestion = 1;
            this.userAnswers = {};
            this.timeLeft = CONFIG.totalTime;
            this.lastRenderedQuestion = null;

            if (this.dom.qImage) {
                this.dom.qImage.removeAttribute('src');
                this.dom.qImage.classList.remove('is-loading');
            }

            this.screens.intro.classList.remove('hidden');
        }

        startTest() {
            const age = this.dom.userAge.value;
            if (!age) {
                this.dom.modalTitle.innerText = "Error";
                this.dom.modalMessage.innerText = this.t('age_label');

                const tempHandler = () => {
                    this.hideConfirm();
                    this.applyTranslations();
                    this.dom.confirmBtn.onclick = () => this.forceEnd();
                };

                this.dom.confirmBtn.onclick = tempHandler;
                this.dom.confirmModal.classList.remove('hidden');
                return;
            }
            localStorage.setItem('raven_age', age);
            this.agePercent = parseInt(age);
            this.screens.intro.classList.add('hidden');
            this.screens.test.classList.remove('hidden');
            this.testActive = true;
            this.startTimer();
            this.renderQuestion();
        }

        startTimer() {
            this.endTime = Date.now() + (this.timeLeft * 1000);
            this.updateTimerDisplay();
            this.timerInterval = setInterval(() => {
                if (!this.testActive) return;
                const now = Date.now();
                const remaining = Math.ceil((this.endTime - now) / 1000);
                this.timeLeft = Math.max(0, remaining);
                this.updateTimerDisplay();
                if (this.timeLeft <= 0) this.finishTest();
            }, 1000);
        }

        updateTimerDisplay() {
            this.dom.timerBar.style.width = `${(this.timeLeft / CONFIG.totalTime) * 100}%`;
        }

        getSeries(n) {
            if (n <= 12) return 'A';
            if (n <= 24) return 'B';
            if (n <= 36) return 'C';
            if (n <= 48) return 'D';
            return 'E';
        }

        renderQuestion() {
            const q = this.currentQuestion;
            const s = this.getSeries(q);
            const template = this.t('progress_template');
            this.dom.progressContainer.innerText = template.replace('{q}', q).replace('{s}', s);

            if (this.lastRenderedQuestion !== q) {
                this.lastRenderedQuestion = q;
                this.showQuestionImage(q);
            }

            this.dom.options.innerHTML = '';
            this.dom.options.className = 'options-grid';
            const optCount = (s === 'A' || s === 'B') ? 6 : 8;
            if (optCount === 6) this.dom.options.classList.add('cols-6');
            for (let i = 1; i <= optCount; i++) {
                const btn = document.createElement('div');
                btn.className = `option-btn ${this.userAnswers[q] === i ? 'selected' : ''}`;
                btn.innerText = i;
                btn.onclick = () => this.selectAnswer(i);
                this.dom.options.appendChild(btn);
            }
            this.dom.prevBtn.disabled = q === 1;
            if (q === CONFIG.questionCount) {
                this.dom.nextBtn.innerText = this.t('btn_finish');
                this.dom.nextBtn.classList.add('btn-finish');
            } else {
                this.dom.nextBtn.innerText = this.t('btn_next');
                this.dom.nextBtn.classList.remove('btn-finish');
            }
        }

        /**
         * Swap the matrix image through the browser cache. No blob URLs are
         * created, so going back and forth costs no extra memory.
         */
        showQuestionImage(q) {
            const img = this.dom.qImage;
            if (!img) return;

            const done = () => {
                img.classList.remove('is-loading');
                img.onload = null;
                img.onerror = null;
                // Only start background prefetching once the matrix the user is
                // looking at has arrived, so it never competes for bandwidth.
                this.preloader.schedule(q);
            };

            img.classList.add('is-loading');
            img.onload = done;
            img.onerror = done;
            img.src = `${CONFIG.imagePath}${q}${CONFIG.imageExt}`;

            // A cached image can be complete immediately.
            if (img.complete && img.naturalWidth > 0) done();
        }

        selectAnswer(val) {
            this.userAnswers[this.currentQuestion] = val;

            const buttons = this.dom.options.children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.toggle('selected', i + 1 === val);
            }
        }

        nextQuestion() {
            if (this.currentQuestion < 60) {
                this.currentQuestion++;
                this.renderQuestion();
            } else {
                this.finishTest();
            }
        }

        prevQuestion() {
            if (this.currentQuestion > 1) {
                this.currentQuestion--;
                this.renderQuestion();
            }
        }

        finishTest() {
            clearInterval(this.timerInterval);
            this.testActive = false;
            this.screens.test.classList.add('hidden');
            this.screens.result.classList.remove('hidden');
            this.calculateResults();
        }

        confirmEndTest() { if (this.dom.confirmModal) this.dom.confirmModal.classList.remove('hidden'); }
        hideConfirm() { if (this.dom.confirmModal) this.dom.confirmModal.classList.add('hidden'); }
        forceEnd() { this.hideConfirm(); this.resetApp(); }

        getClosestNormative(score) {
            if (score < 15) {
                const ratio = score / 15;
                return [
                    Math.round(8 * ratio),
                    Math.round(4 * ratio),
                    Math.round(2 * ratio),
                    Math.round(1 * ratio),
                    0
                ];
            }

            if (NORMATIVE_DISTRIBUTION[score]) return NORMATIVE_DISTRIBUTION[score];
            const keys = Object.keys(NORMATIVE_DISTRIBUTION).map(Number).sort((a, b) => a - b);
            let closest = keys[0];
            let minDiff = Math.abs(score - closest);
            for (let i = 1; i < keys.length; i++) {
                const diff = Math.abs(score - keys[i]);
                if (diff < minDiff) { minDiff = diff; closest = keys[i]; }
            }
            return NORMATIVE_DISTRIBUTION[closest];
        }

        calculateResults() {
            const ANSWER_KEY = getAnswers();
            let rawScore = 0;
            const seriesScores = { A:0, B:0, C:0, D:0, E:0 };
            for (let i = 1; i <= 60; i++) {
                if (this.userAnswers[i] === ANSWER_KEY[i]) {
                    rawScore++;
                    seriesScores[this.getSeries(i)]++;
                }
            }

            let baseIQ = getBaseIQ(rawScore);
            let finalIQ = Math.round((baseIQ * 100) / this.agePercent);
            document.getElementById('final-iq').innerText = finalIQ;

            let diagnosisText = "";
            if (finalIQ >= 140) diagnosisText = this.t('diag_exceptional');
            else if (finalIQ >= 121) diagnosisText = this.t('diag_high');
            else if (finalIQ >= 111) diagnosisText = this.t('diag_above_avg');
            else if (finalIQ >= 91) diagnosisText = this.t('diag_avg');
            else if (finalIQ >= 81) diagnosisText = this.t('diag_below_avg');
            else if (finalIQ >= 71) diagnosisText = this.t('diag_low');
            else if (finalIQ >= 51) diagnosisText = this.t('diag_mild');
            else if (finalIQ >= 21) diagnosisText = this.t('diag_moderate');
            else diagnosisText = this.t('diag_severe');
            document.getElementById('final-diagnosis').innerText = diagnosisText;

            let degreeText = "";
            if (finalIQ >= 121) degreeText = this.t('degree_1');
            else if (finalIQ >= 111) degreeText = this.t('degree_2');
            else if (finalIQ >= 91) degreeText = this.t('degree_3');
            else if (finalIQ >= 81) degreeText = this.t('degree_4');
            else degreeText = this.t('degree_5');

            document.getElementById('interpretation-text').innerText = degreeText;

            const recText = this.getRecommendations(finalIQ);
            document.getElementById('recommendation-text').innerText = recText;

            const tbody = document.getElementById('series-table-body');
            tbody.innerHTML = '';
            const seriesNames = ['A', 'B', 'C', 'D', 'E'];
            const expectedNorms = this.getClosestNormative(rawScore);
            let unreliableSeriesCount = 0;
            let deviationA = 0;

            seriesNames.forEach((s, index) => {
                const score = seriesScores[s];
                const expectedScore = expectedNorms[index];
                const deviation = score - expectedScore;
                if (s === 'A') deviationA = deviation;
                const isReliable = Math.abs(deviation) <= 2;
                if (!isReliable) unreliableSeriesCount++;
                const devString = deviation > 0 ? '+' + deviation : deviation;
                const statusClass = isReliable ? '' : 'alert-danger';

                const tr = document.createElement('tr');

                const tdSeries = document.createElement('td');
                tdSeries.textContent = `${this.t('series_label')} ${s}`;
                tr.appendChild(tdSeries);

                const tdCorrect = document.createElement('td');
                tdCorrect.textContent = score;
                tr.appendChild(tdCorrect);

                const tdDeviation = document.createElement('td');
                tdDeviation.textContent = devString;
                if(statusClass) tdDeviation.classList.add(statusClass);
                tr.appendChild(tdDeviation);

                tbody.appendChild(tr);
            });

            const timeTaken = CONFIG.totalTime - this.timeLeft;
            const m = Math.floor(timeTaken / 60);
            const s = timeTaken % 60;
            this.dom.totalScore.innerText = `${rawScore} / 60`;
            this.dom.timeTaken.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;

            const ageVal = document.getElementById('user-age-val');
            if (ageVal && this.dom.userAge && this.dom.userAge.selectedIndex >= 0) {
                ageVal.innerText = this.dom.userAge.options[this.dom.userAge.selectedIndex].text;
            }

            const relMsg = document.getElementById('reliability-msg');

            if (deviationA <= -3) {
                relMsg.innerText = this.t('reliability_defect');
                relMsg.className = "alert-danger";
            } else if (unreliableSeriesCount > 2) {
                relMsg.innerText = this.t('reliability_unreliable');
                relMsg.className = "alert-danger";
            } else if (rawScore < 15) {
                relMsg.innerText = this.t('reliability_low_reliability');
                relMsg.className = "alert-warning";
            } else {
                relMsg.innerText = this.t('reliability_good');
                relMsg.className = "alert-success";
            }
        }

        getRecommendations(iq) {
            if (iq >= 120) return this.t('rec_120');
            if (iq >= 110) return this.t('rec_110');
            if (iq >= 90) return this.t('rec_90');
            if (iq >= 80) return this.t('rec_80');
            return this.t('rec_low');
        }
    }

    window.app = new RavenApp();
    window.app.init();
})();
</script>
